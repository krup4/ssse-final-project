openapi: 3.0.3
info:
  title: Weather Forecast Accuracy Core API
  version: 1.0.0
  description: >
    Core API for weather forecast accuracy analytics. The API serves the
    presentation layer with authentication, station dictionaries, operational
    metrics, forecast-vs-actual error analytics, alerts, access management,
    and backfill control.
servers:
  - url: /api/v1
    description: Relative API base path

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Login and current user endpoints.
  - name: Dictionaries
    description: Regions and weather station dictionaries.
  - name: Dashboard
    description: System overview and operational metrics.
  - name: Analytics
    description: Forecast accuracy analytical views.
  - name: Alerts
    description: Monitoring alerts and alert lifecycle.
  - name: Users
    description: User and role management.
  - name: Backfills
    description: Recalculation jobs after formula or data logic changes.

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: Authenticates a user and returns a JWT token plus user profile.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              analyst:
                value:
                  email: analyst@weather.local
                  password: password
      responses:
        "200":
          description: Authenticated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      description: Returns profile and role for the authenticated user.
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /regions:
    get:
      tags: [Dictionaries]
      summary: List regions
      description: Returns regions available for filtering stations and analytics.
      responses:
        "200":
          description: Region list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Region"

  /stations:
    get:
      tags: [Dictionaries]
      summary: List weather stations
      description: Returns weather stations with coordinates, status, sensor count, and current max error.
      parameters:
        - $ref: "#/components/parameters/RegionId"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/StationStatus"
          description: Optional station status filter.
      responses:
        "200":
          description: Station list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Station"

  /metrics/overview:
    get:
      tags: [Dashboard]
      summary: Get dashboard overview
      description: >
        Returns operational status and forecast accuracy summary for dashboard
        cards and trend charts.
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/RegionId"
        - $ref: "#/components/parameters/StationId"
        - $ref: "#/components/parameters/Metric"
      responses:
        "200":
          description: Dashboard overview metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewMetrics"
        "400":
          $ref: "#/components/responses/ValidationError"

  /analytics/worst-errors:
    get:
      tags: [Analytics]
      summary: Get worst forecast errors
      description: Returns ranked forecast-vs-actual points with highest absolute errors.
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/RegionId"
        - $ref: "#/components/parameters/StationId"
        - $ref: "#/components/parameters/Metric"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
          description: Maximum number of rows to return.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [absoluteError_desc, absoluteError_asc]
            default: absoluteError_desc
      responses:
        "200":
          description: Ranked error rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForecastErrorRow"
        "400":
          $ref: "#/components/responses/ValidationError"

  /analytics/parameter-errors:
    get:
      tags: [Analytics]
      summary: Get errors by weather parameter
      description: >
        Returns forecast error rows split by specific weather parameters such as
        temperature, precipitation, wind speed, wind gust, humidity, and pressure.
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/RegionId"
        - $ref: "#/components/parameters/StationId"
        - name: parameter
          in: query
          required: false
          schema:
            oneOf:
              - $ref: "#/components/schemas/WeatherParameter"
              - type: string
                enum: [all]
            default: all
          description: Weather parameter to inspect. Use all for all parameters.
      responses:
        "200":
          description: Parameter-level error rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParameterErrorRow"
        "400":
          $ref: "#/components/responses/ValidationError"

  /analytics/parameter-error-trend:
    get:
      tags: [Analytics]
      summary: Get parameter error trend
      description: >
        Returns a time series for selected weather parameter error trend. For
        parameter=all, the backend may return all parameter series and the UI
        may aggregate them.
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/RegionId"
        - $ref: "#/components/parameters/StationId"
        - name: parameter
          in: query
          required: false
          schema:
            oneOf:
              - $ref: "#/components/schemas/WeatherParameter"
              - type: string
                enum: [all]
            default: all
        - name: bucket
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TimeBucket"
          description: Time aggregation bucket.
      responses:
        "200":
          description: Parameter error trend points.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParameterErrorTrendPoint"
        "400":
          $ref: "#/components/responses/ValidationError"

  /analytics/station-series:
    get:
      tags: [Analytics]
      summary: Get station forecast-vs-actual series
      description: Returns forecast, actual, and absolute error time series for charting a station or region.
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/StationIdRequired"
        - $ref: "#/components/parameters/MetricRequired"
        - name: bucket
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TimeBucket"
          description: Time aggregation bucket.
      responses:
        "200":
          description: Forecast-vs-actual series.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StationSeriesPoint"
        "400":
          $ref: "#/components/responses/ValidationError"

  /analytics/history:
    get:
      tags: [Analytics]
      summary: Get historical analytics
      description: Returns Gold-layer historical aggregates with calculation/backfill version metadata.
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/RegionId"
        - $ref: "#/components/parameters/StationId"
        - $ref: "#/components/parameters/Metric"
      responses:
        "200":
          description: Historical aggregate rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoricalMetric"
        "400":
          $ref: "#/components/responses/ValidationError"

  /alerts:
    get:
      tags: [Alerts]
      summary: List alerts
      description: Returns observability and data-quality alerts.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AlertStatus"
        - name: severity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AlertSeverity"
        - name: source
          in: query
          required: false
          schema:
            type: string
          description: Alert source service filter.
      responses:
        "200":
          description: Alert list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /alerts/{id}:
    patch:
      tags: [Alerts]
      summary: Update alert status
      description: "Updates alert lifecycle status. Roles allowed: admin, operator."
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAlertRequest"
      responses:
        "200":
          description: Updated alert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users:
    get:
      tags: [Users]
      summary: List users
      description: "Returns users and roles. Roles allowed: admin."
      responses:
        "200":
          description: User list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}/role:
    patch:
      tags: [Users]
      summary: Change user role
      description: "Changes a user's role. Roles allowed: admin."
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleRequest"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /backfills:
    post:
      tags: [Backfills]
      summary: Start backfill
      description: >
        Creates a recalculation job for historical data after changing forecast
        accuracy formula, validation rules, deduplication rules, or source
        normalization logic. Roles allowed: admin, analyst.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBackfillRequest"
      responses:
        "202":
          description: Backfill job queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackfillJob"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /backfills/{id}:
    get:
      tags: [Backfills]
      summary: Get backfill status
      description: Returns current status and progress for a backfill job.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Backfill job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackfillJob"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource identifier.
    DateFrom:
      name: dateFrom
      in: query
      required: true
      schema:
        type: string
        format: date
      example: "2026-07-01"
    DateTo:
      name: dateTo
      in: query
      required: true
      schema:
        type: string
        format: date
      example: "2026-07-07"
    RegionId:
      name: regionId
      in: query
      required: false
      schema:
        type: string
      description: Region id. Omit or use all to include all regions.
    StationId:
      name: stationId
      in: query
      required: false
      schema:
        type: string
      description: Station id. Omit or use all to include all stations.
    StationIdRequired:
      name: stationId
      in: query
      required: true
      schema:
        type: string
      description: Station id.
    Metric:
      name: metric
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Metric"
    MetricRequired:
      name: metric
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/Metric"

  responses:
    ValidationError:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid authentication token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated user does not have permission for this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: analyst@weather.local
        password:
          type: string
          format: password
          minLength: 1
          example: password

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT access token.
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, name, email, role, lastSeen]
      properties:
        id:
          type: string
          example: u-2
        name:
          type: string
          example: Alex Analyst
        email:
          type: string
          format: email
          example: analyst@weather.local
        role:
          $ref: "#/components/schemas/UserRole"
        lastSeen:
          type: string
          format: date-time
          example: "2026-07-07T09:10:00Z"

    UserRole:
      type: string
      enum: [admin, analyst, operator, viewer]

    Region:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: central
        name:
          type: string
          example: Central District

    Station:
      type: object
      required: [id, name, regionId, lat, lon, status, activeSensors, maxError, lastTelemetryAt]
      properties:
        id:
          type: string
          example: st-004
        name:
          type: string
          example: Ryazan Field
        regionId:
          type: string
          example: central
        lat:
          type: number
          format: double
          example: 54.626
        lon:
          type: number
          format: double
          example: 39.735
        status:
          $ref: "#/components/schemas/StationStatus"
        activeSensors:
          type: integer
          minimum: 0
          example: 0
        maxError:
          type: number
          format: double
          example: 21.1
        lastTelemetryAt:
          type: string
          format: date-time
          example: "2026-07-07T07:35:00Z"

    StationStatus:
      type: string
      enum: [online, degraded, offline]

    Metric:
      type: string
      enum: [temperature, wind_speed, humidity, pressure, precipitation]

    WeatherParameter:
      type: string
      enum:
        - temperature
        - precipitation_total
        - wind_speed
        - wind_gust
        - humidity
        - pressure

    TimeBucket:
      type: string
      enum: [1h, 3h, 6h, 1d]
      default: 1h

    OverviewMetrics:
      type: object
      required:
        - activeStations
        - degradedStations
        - offlineStations
        - kafkaLag
        - requestRate
        - p95LatencyMs
        - worstErrorToday
        - errorTrend
      properties:
        activeStations:
          type: integer
          example: 5
        degradedStations:
          type: integer
          example: 2
        offlineStations:
          type: integer
          example: 1
        kafkaLag:
          type: integer
          example: 2840
        requestRate:
          type: number
          example: 126
        p95LatencyMs:
          type: number
          example: 188
        worstErrorToday:
          type: number
          example: 21.1
        errorTrend:
          type: array
          items:
            $ref: "#/components/schemas/ErrorTrendPoint"

    ErrorTrendPoint:
      type: object
      required: [date, mae, rmse]
      properties:
        date:
          type: string
          example: "2026-07-07"
        mae:
          type: number
          example: 9.1
        rmse:
          type: number
          example: 12.8

    ForecastErrorRow:
      type: object
      required:
        - id
        - stationId
        - stationName
        - regionName
        - metric
        - forecastValue
        - actualValue
        - absoluteError
        - errorPct
        - observedAt
      properties:
        id:
          type: string
          example: e-1
        stationId:
          type: string
          example: st-004
        stationName:
          type: string
          example: Ryazan Field
        regionName:
          type: string
          example: Central District
        metric:
          $ref: "#/components/schemas/Metric"
        forecastValue:
          type: number
          example: 8.2
        actualValue:
          type: number
          example: 29.3
        absoluteError:
          type: number
          example: 21.1
        errorPct:
          type: number
          example: 257
        observedAt:
          type: string
          format: date-time
          example: "2026-07-07T07:30:00Z"

    ParameterErrorRow:
      type: object
      required:
        - id
        - parameter
        - stationId
        - stationName
        - regionName
        - forecastValue
        - actualValue
        - absoluteError
        - errorPct
        - contributionPct
        - samples
        - observedAt
      properties:
        id:
          type: string
          example: pe-8
        parameter:
          $ref: "#/components/schemas/WeatherParameter"
        stationId:
          type: string
          example: st-006
        stationName:
          type: string
          example: Caspian Steppe
        regionName:
          type: string
          example: Southern District
        forecastValue:
          type: number
          example: 11
        actualValue:
          type: number
          example: 34.8
        absoluteError:
          type: number
          example: 23.8
        errorPct:
          type: number
          example: 216
        contributionPct:
          type: number
          description: Percent contribution of this parameter to total selected error.
          example: 27
        samples:
          type: integer
          minimum: 0
          example: 220
        observedAt:
          type: string
          format: date-time
          example: "2026-07-07T08:20:00Z"

    ParameterErrorTrendPoint:
      type: object
      required: [timestamp, parameter, absoluteError, mae]
      properties:
        timestamp:
          type: string
          description: Bucket timestamp or display label.
          example: "2026-07-07T09:00:00Z"
        parameter:
          $ref: "#/components/schemas/WeatherParameter"
        absoluteError:
          type: number
          description: Maximum absolute error in this bucket.
          example: 23.8
        mae:
          type: number
          description: Mean absolute error in this bucket.
          example: 11.6

    StationSeriesPoint:
      type: object
      required: [timestamp, forecast, actual, absoluteError]
      properties:
        timestamp:
          type: string
          example: "2026-07-07T06:00:00Z"
        forecast:
          type: number
          example: 8.2
        actual:
          type: number
          example: 29.3
        absoluteError:
          type: number
          example: 21.1

    HistoricalMetric:
      type: object
      required: [date, regionName, stationName, mae, rmse, samples, backfillVersion]
      properties:
        date:
          type: string
          format: date
          example: "2026-07-01"
        regionName:
          type: string
          example: Northern District
        stationName:
          type: string
          example: Murmansk Port
        mae:
          type: number
          example: 5.8
        rmse:
          type: number
          example: 7.2
        samples:
          type: integer
          example: 2304
        backfillVersion:
          type: string
          example: calc-v3

    Alert:
      type: object
      required: [id, title, source, severity, status, startedAt, updatedAt]
      properties:
        id:
          type: string
          example: a-1
        title:
          type: string
          example: Kafka lag above SLO
        source:
          type: string
          example: Telemetry Receiver
        severity:
          $ref: "#/components/schemas/AlertSeverity"
        status:
          $ref: "#/components/schemas/AlertStatus"
        startedAt:
          type: string
          format: date-time
          example: "2026-07-07T08:50:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-07-07T09:10:00Z"

    AlertSeverity:
      type: string
      enum: [critical, warning, info]

    AlertStatus:
      type: string
      enum: [open, acknowledged, resolved]

    UpdateAlertRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/AlertStatus"

    UpdateUserRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/UserRole"

    CreateBackfillRequest:
      type: object
      required: [dateFrom, dateTo, calculationVersion]
      properties:
        dateFrom:
          type: string
          format: date
          example: "2026-07-01"
        dateTo:
          type: string
          format: date
          example: "2026-07-07"
        regionId:
          type: string
          nullable: true
          example: central
        stationId:
          type: string
          nullable: true
          example: st-004
        metric:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Metric"
        calculationVersion:
          type: string
          example: calc-v4

    BackfillJob:
      type: object
      required: [id, status, calculationVersion, createdAt]
      properties:
        id:
          type: string
          example: bf-20260707-001
        status:
          $ref: "#/components/schemas/BackfillStatus"
        calculationVersion:
          type: string
          example: calc-v4
        progressPct:
          type: number
          minimum: 0
          maximum: 100
          example: 42
        processedRows:
          type: integer
          minimum: 0
          example: 1200000
        failedRows:
          type: integer
          minimum: 0
          example: 0
        createdAt:
          type: string
          format: date-time
          example: "2026-07-07T09:20:00Z"
        startedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-07-07T09:21:00Z"
        finishedAt:
          type: string
          format: date-time
          nullable: true
          example: null

    BackfillStatus:
      type: string
      enum: [queued, running, completed, failed, cancelled]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - RATE_LIMITED
                - INTERNAL_ERROR
              example: VALIDATION_ERROR
            message:
              type: string
              example: dateFrom must be before dateTo
            details:
              type: object
              additionalProperties: true
              example:
                field: dateFrom
