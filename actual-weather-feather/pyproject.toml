[project]
name = "actual-weather-feather"
version = "1.0.0"
description = "Actual weather microservice (Yandex Weather → PostgreSQL → Kafka)"
requires-python = ">=3.12"
readme = "README.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
